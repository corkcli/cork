[package]
name = "cork-protocol-tasks"
version = "0.1.0"
edition = "2021"
description = "The tasks domain for cork-protocol: keys are tasks, the graph is blockers. A shared work queue where two agents never take the same task."
license = "MIT"

[lib]
name = "cork_protocol_tasks"
path = "src/lib.rs"

[dependencies]
cork-protocol = { path = "../../core" }
serde_json = "1"
