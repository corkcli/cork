[package]
name = "cork-protocol-conformance"
version = "0.1.0"
edition = "2021"
description = "Replays schema/vectors/*.json against the Engine."
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
cork-protocol = { path = "../core" }
cork-protocol-code = { path = "../domains/code" }
cork-protocol-notes = { path = "../domains/notes" }
cork-protocol-tasks = { path = "../domains/tasks" }
serde_json = "1"

[dev-dependencies]
cork-protocol = { path = "../core", features = ["ws-server", "ws-client-blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
